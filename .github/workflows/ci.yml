name: ci

on:
  pull_request:
  push:
    branches: ["**"]   # every branch, no tags: the release tags are pushed by the tags job
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A pull request: everything enforced, against its base — the gate before a release.
      - if: github.event_name == 'pull_request'
        run: node scripts/catalog.mjs --check --since "${{ github.event.pull_request.base.sha }}"
      # A push to main: everything enforced, against what main was.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/catalog.mjs --check --since "${{ github.event.before }}"
      # A push to a work branch: the branch as one change against main, gates only warn.
      - if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: node scripts/check.mjs

  # Every released version gets its <id>/v<version> tag once it is on main — also when the pull
  # request was merged on GitHub, where no local hook runs. (Tags pushed with GITHUB_TOKEN start
  # no new workflow run.)
  tags:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/tags.mjs
          git push origin --tags
          node scripts/tags.mjs --check

  testbed:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TESTBED_DB_DSN: "root:@tcp(127.0.0.1:3306)/"
    steps:
      # Projects come from the pinned kernel host (kernel/): nothing outside this repository.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: node scripts/testbed.mjs

  # Every Go module's unit tests on Windows, where the wall clock moves in steps of about a
  # millisecond (Linux's every nanosecond): a test that needs two moments to differ passes on one
  # and fails on the other. One sandbox project holds them all; no database — the testbed above
  # runs the MySQL checks.
  windows:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The rules read paths as Windows writes them.
      - run: node scripts/catalog.mjs --check
      # A checkout made before .gitattributes holds CRLF (core.autocrlf=true): rewrite every file
      # outside kernel/ that way, then the check must still pass and the sandbox below installs
      # from it (as LF).
      - name: the check on a CRLF checkout
        run: |
          node -e 'const { execSync } = require("child_process"), fs = require("fs"); for (const f of execSync("git ls-files -z", { encoding: "utf8" }).split("\0")) { if (!f || f.startsWith("kernel/")) continue; const s = fs.readFileSync(f, "utf8"); if (!s.includes("\0")) fs.writeFileSync(f, s.replace(/\r?\n/g, "\r\n")); }'
          node scripts/catalog.mjs --check
      - name: sqlc
        run: CGO_ENABLED=0 go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: a project with every Go module
        run: |
          ids=$(node -e 'const fs = require("fs"); console.log(fs.readdirSync("modules").filter((id) => JSON.parse(fs.readFileSync(`modules/${id}/module.json`, "utf8")).stacks?.includes("go")).join(" "))')
          node scripts/sandbox.mjs $ids --no-preset --no-setup --dir .sandbox/windows
      - name: go vet and go test
        working-directory: .sandbox/windows
        run: |
          (cd apps/api && go mod tidy)
          node scripts/sqlc.mjs
          cd apps/api
          go vet ./...
          go test -count=1 ./...
